<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 滑動效果lesson 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-color: #fce4ec;
        }

        body {
            height: 300vh; /* 讓頁面有足夠的高度以便滾動 */
            color: white;
            font-family: Arial, sans-serif;
        }

        .content {
            padding: 50px;
        }
    
        .content {
            position: fixed;
            top: 10%;
            left: 8%;
            pointer-events: none; /* 讓滑鼠滾輪穿透文字，不影響滾動 */
        }

        .info-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 24px 32px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            backdrop-filter: blur(8px);
            max-width: 320px;
            color: #333;
            transition: all 0.3s ease;
        }

        .info-box h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #d84315;
        }

        .info-box p {
            font-size: 1rem;
            line-height: 1.5;
            color: #555;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 GSAP 與 ScrollTrigger 外掛 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    <div class="content">
        <div class="info-box">
            <h1 id="burger-title">🍔 經典咕咕嘎嘎卡通漢堡</h1>
            <p id="burger-desc">往下滑動，探索看看！</p>
        </div>
    </div>

    <script>
        // 1. 建立場景 (Scene)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfce4ec);

        // 2. 建立相機 (Camera)
        const camera = new THREE.PerspectiveCamera(
          75, 
          window.innerWidth / window.innerHeight, 
          0.1, 
          1000
        );
        camera.position.z = 8;

        // 3. 建立渲染器 (Renderer)
        const canvas = document.getElementById('webgl-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // 4. 打光 (Light)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // 建立光線投射器與滑鼠座標向量
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredMesh = null; // 紀錄目前滑鼠指著的食材

        // 監聽滑鼠移動事件，轉換座標為 Three.js 標準座標 (-1 到 1)
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // 5. 建立卡通漢堡 5 層零件
        const group = new THREE.Group();

        // 【第一層：漢堡上麵包】
        const screenGeo = new THREE.SphereGeometry(1.5, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5);
        const screenMat = new THREE.MeshStandardMaterial({ color: 0xE5A65D, roughness: 0.6, metalness: 0.0 });
        const layer1_screen = new THREE.Mesh(screenGeo, screenMat);
        layer1_screen.position.y = 0.4;

        // 【第二層：鮮翠生菜】
        const boardGeo = new THREE.CylinderGeometry(1.6, 1.6, 0.08, 32);
        const boardMat = new THREE.MeshStandardMaterial({ color: 0x7CB342, roughness: 0.6, metalness: 0.0 });
        const layer2_board = new THREE.Mesh(boardGeo, boardMat);
        layer2_board.position.y = 0.25;

        // 【第三層：鮮紅番茄】
        const tomatoGeo = new THREE.CylinderGeometry(1.3, 1.3, 0.12, 32);
        const tomatoMat = new THREE.MeshStandardMaterial({ color: 0xE53935, roughness: 0.4, metalness: 0.0 });
        const layer_tomato = new THREE.Mesh(tomatoGeo, tomatoMat);
        layer_tomato.position.y = 0.1;

        // 【新增：濃郁起司片】 (黃色方片，稍微旋轉一下看起來更有層次)
        const cheeseGeo = new THREE.BoxGeometry(2.4, 0.05, 2.4); // 方形起司片
        const cheeseMat = new THREE.MeshStandardMaterial({ color: 0xFFCA28, roughness: 0.5, metalness: 0.0 }); // 香濃金黃起司色
        const layer_cheese = new THREE.Mesh(cheeseGeo, cheeseMat);
        layer_cheese.position.y = 0.02; // 放在番茄下面、肉餅上面
        layer_cheese.rotation.y = Math.PI / 8; // 微微旋轉 22.5 度，讓角角凸出來更可愛！

        // 【第四層：厚切牛肉餅】
        const pattyGeo = new THREE.CylinderGeometry(1.4, 1.4, 0.25, 32);
        const pattyMat = new THREE.MeshStandardMaterial({ color: 0x5D4037, roughness: 0.7, metalness: 0.0 });
        const layer_patty = new THREE.Mesh(pattyGeo, pattyMat);
        layer_patty.position.y = -0.13;

        // 【第五層：漢堡下麵包】
        const bottomBunGeo = new THREE.CylinderGeometry(1.4, 1.3, 0.25, 32);
        const bottomBunMat = new THREE.MeshStandardMaterial({ color: 0xE5A65D, roughness: 0.6, metalness: 0.0 });
        const layer3_base = new THREE.Mesh(bottomBunGeo, bottomBunMat);
        layer3_base.position.y = -0.4;

        // 將 5 個漢堡食材加入群組
        group.add(layer1_screen); // 上麵包
        group.add(layer2_board);  // 生菜
        group.add(layer_tomato);  // 番茄
        group.add(layer_cheese);  // 🧀 新增：起司片
        group.add(layer_patty);   // 牛肉餅
        group.add(layer3_base);   // 下麵包

        scene.add(group);

        // 傾斜群組
        group.rotation.x = 0.1;
        group.rotation.y = 0.4;

        // 7. 視窗大小自動適應
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 6. 動畫繪製迴圈 (Animation Loop)
        function animate() {
            requestAnimationFrame(animate);

            // 讓整組漢堡慢慢旋轉
            group.rotation.y += 0.005;

            // 1. 設定光線投射器的起點為相機，方向為滑鼠位置
            raycaster.setFromCamera(mouse, camera);

            // 2. 計算光線穿過的漢堡食材 (group 中的物件)
            const intersects = raycaster.intersectObjects(group.children);

            // 3. 恢復前一個懸停食材的原本顏色/發光狀態
            if (hoveredMesh) {
                hoveredMesh.material.emissive.setHex(0x000000); // 關閉發光
                hoveredMesh = null;
            }

            // 4. 如果滑鼠有指到食材，讓該食材微微發光
            if (intersects.length > 0) {
                hoveredMesh = intersects[0].object;
                hoveredMesh.material.emissive.setHex(0x333333); // 設定微弱自發光效果
            }

            renderer.render(scene, camera);
            }
        // 註冊 ScrollTrigger 外掛
        gsap.registerPlugin(ScrollTrigger);

        // 取得 HTML 文字元素
            const titleEl = document.getElementById('burger-title');
            const descEl = document.getElementById('burger-desc');

        // 建立 GSAP 時間軸
        const tl = gsap.timeline({
          scrollTrigger: {
            trigger: "body",
            start: "top top",
            end: "bottom bottom",
            scrub: 1
          }
        });

         // 1. 在 GSAP 動畫加入起司片的 y 軸移動
            tl.to(layer1_screen.position, { y: 2.2 }, 0)  // 上麵包
            .to(layer2_board.position,  { y: 1.3 }, 0)  // 生菜
            .to(layer_tomato.position,  { y: 0.5 }, 0)  // 番茄
            .to(layer_cheese.position,  { y: -0.1 }, 0) // 🧀 起司片
            .to(layer_patty.position,   { y: -0.7 }, 0) // 牛肉餅
            .to(layer3_base.position,   { y: -1.6 }, 0) // 下麵包
            .to(group.rotation,         { x: 0.8, y: 1.2 }, 0);

        // 2. 更新文字介紹，加入起司說明
            tl.to({}, {
            onUpdate: function() {
                const progress = tl.progress();
                
                if (progress < 0.16) {
                titleEl.innerText = "🍔 經典咕咕嘎嘎卡通漢堡";
                descEl.innerText = "往下滑動，探索看看！";
                } else if (progress < 0.33) {
                titleEl.innerText = "🍞 香烤金黃上麵包";
                descEl.innerText = "外酥內軟，帶有濃郁小麥香氣的蓬鬆麵包蓋。";
                } else if (progress < 0.5) {
                titleEl.innerText = "🥗 鮮翠有機生菜";
                descEl.innerText = "產地直送新鮮波浪生菜，爽脆多汁清爽不油膩。";
                } else if (progress < 0.66) {
                titleEl.innerText = "🍅 熟成厚切鮮番茄";
                descEl.innerText = "嚴選紅潤多汁蕃茄薄片，酸甜口感完美提味。";
                } else if (progress < 0.83) {
                titleEl.innerText = "🧀 香濃切達起司片";
                descEl.innerText = "濃郁香醇切達起司，微融狀態包裹著熱騰騰肉餅。";
                } else {
                titleEl.innerText = "🥩 秘製厚切牛肉餅";
                descEl.innerText = "100% 純牛肉多汁熟成煎烤，鎖住豐富肉汁。";
                }
            }
            }, 0);
        // 開始渲染
        animate();
    </script>
</body>
</html>
